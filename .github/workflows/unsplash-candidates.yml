name: Unsplash photo candidates (review only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find Unsplash photos
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/unsplash_candidates.py
      - name: Commit review gallery metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unsplash-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Unsplash photo candidates for approval"
            git push
          fi
