name: Audit racing data sources on development
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'scripts/audit_standings_sources.py'
      - 'data/standings/**'
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_standings_sources.py
      - name: Commit quality report to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality/standings-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit development standings source coverage"
            git pull --rebase origin dev
            git push origin dev
          fi
