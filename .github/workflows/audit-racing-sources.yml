name: Audit racing data sources on development
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'scripts/audit_standings_sources.py'
      - 'data/standings/**'
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_standings_sources.py
      - name: Commit quality report to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recompute from the newest dev tree to avoid stale push races.
          for attempt in 1 2 3 4; do
            git fetch origin dev
            git reset --hard origin/dev
            python scripts/audit_standings_sources.py
            git add data/quality/standings-audit.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Audit dev data: data/quality/standings-audit.json"
            if git push origin HEAD:dev; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not publish audit report after 4 attempts" >&2
          exit 1
