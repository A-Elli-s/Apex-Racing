name: Wiki probe (temporary)
on:
  push:
    branches: [claude/wiki-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install beautifulsoup4==4.12.3
      - run: python scripts/_probe.py
