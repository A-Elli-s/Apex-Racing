name: Audit development championship coverage
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'data/races.json'
      - 'data/standings/**'
      - 'scripts/audit_championship_coverage.py'
      - '.github/workflows/audit-championship-coverage.yml'
permissions:
  contents: write
concurrency:
  group: coverage-audit-dev
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all 23 championships
        run: python scripts/audit_championship_coverage.py
      - name: Commit audit report to development only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recompute from the newest dev tree to avoid stale push races.
          for attempt in 1 2 3 4; do
            git fetch origin dev
            git reset --hard origin/dev
            python scripts/audit_championship_coverage.py
            git add data/quality/championship-coverage.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Audit dev data: data/quality/championship-coverage.json"
            if git push origin HEAD:dev; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not publish audit report after 4 attempts" >&2
          exit 1
