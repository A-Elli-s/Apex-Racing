name: Refresh non-F1 standings (development only)
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/update_standings.py'
      - 'scripts/update_rendered_standings.py'
      - 'scripts/audit_points.py'
      - 'scripts/audit_coverage.py'
      - 'scripts/update_motogp_community.py'
      - '.github/workflows/update-dev-standings.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-racing-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conservative public-page parsers
        run: python -m pip install beautifulsoup4==4.12.3 playwright==1.55.0
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Refresh accessible championship tables without bypassing blocks
        run: python scripts/update_standings.py
      - name: Retry stale JavaScript-rendered standings
        run: python scripts/update_rendered_standings.py
      - name: Stage CC BY-SA MotoGP, Moto2 and Moto3 points (reuse review pending)
        run: python scripts/update_motogp_community.py
      - name: Audit per-event awarded points without guessing totals
        run: python scripts/audit_points.py --write
      - name: Report all 23 championships and source-rights gaps
        run: python scripts/audit_coverage.py
      - name: Commit development snapshots and coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings/
          # This job generates coverage.json for diagnostics only. It belongs to
          # the dedicated audit workflow, so discard its unstaged local change
          # before rebasing our standings-only commit onto the latest dev.
          git restore -- data/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh and audit staged non-F1 championship standings"
            for attempt in 1 2 3 4; do
              git fetch origin dev
              if ! git rebase origin/dev; then
                echo "Standings changed concurrently; aborting safely without overwriting dev" >&2
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:dev; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "Could not publish dev standings after 4 attempts" >&2
            exit 1
          fi
