name: Refresh FIA WEC and WRC standings (development)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'scripts/update_fia_wrc_wec.py'
permissions:
  contents: write
jobs:
  fia-standings:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.12.3
      - name: Validate FIA championship points
        run: python scripts/update_fia_wrc_wec.py
      - name: Save development points tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh FIA WEC and WRC points on dev"
            git push origin HEAD:dev
          fi
