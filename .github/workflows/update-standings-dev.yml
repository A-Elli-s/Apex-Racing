name: Refresh non-F1 standings (development)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'scripts/update_standings.py'
      - 'scripts/update_rendered_standings.py'
      - 'scripts/reconcile_points.py'
      - '.github/workflows/update-standings-dev.yml'
permissions:
  contents: write
concurrency:
  group: standings-refresh-dev
  cancel-in-progress: false
jobs:
  standings:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conservative public-page collector
        run: python -m pip install beautifulsoup4==4.12.3 playwright==1.55.0
      - name: Install Chromium for public JS-rendered pages
        run: python -m playwright install --with-deps chromium
      - name: Collect accessible official standings and community race data
        run: python scripts/update_standings.py
      - name: Collect public rendered standings where permitted
        run: python scripts/update_rendered_standings.py
      - name: Reconcile per-round IMSA points totals
        run: python scripts/reconcile_points.py
      - name: Commit valid refreshed standings on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh non-F1 development standings"
            git pull --rebase origin dev
            git push origin HEAD:dev
          fi
