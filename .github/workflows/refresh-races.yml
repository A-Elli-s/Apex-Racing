name: Refresh racing schedules
on:
  schedule:
    - cron: '17 8,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh supported feeds
        run: python scripts/update_schedules.py
      - name: Commit updated race data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh racing calendar feeds"
            git push
          fi
