name: Refresh F1 API snapshots (development)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6,18 * * *'
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate F1 calendar and points
        run: python scripts/update_f1_api.py
      - name: Commit development snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json data/standings/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh staged F1 API snapshots"
            git push origin HEAD:dev
          fi
