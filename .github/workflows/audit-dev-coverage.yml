name: Audit 23-series coverage (development)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'data/standings/**'
      - 'data/races.json'
      - 'scripts/audit_coverage.py'
      - 'scripts/update_standings.py'
permissions:
  contents: write
concurrency:
  group: dev-coverage-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate coverage and reconcile per-event points
        run: python scripts/audit_coverage.py
      - name: Save dev coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit dev championship coverage"
            git push origin HEAD:dev
          fi
