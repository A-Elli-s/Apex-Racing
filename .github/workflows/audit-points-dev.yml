name: Audit championship points (development)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'scripts/audit_points.py'
      - 'tests/test_points_audit.py'
      - '.github/workflows/audit-points-dev.yml'
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe points calculations
        run: python -m unittest discover -s tests -p 'test_points_audit.py' -v
      - name: Audit and reconstruct eligible points totals
        run: python scripts/audit_points.py --write
      - name: Commit audited snapshots on dev only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings/
          if ! git diff --cached --quiet; then
            git commit -m "Audit current-season race-event points on dev"
            git push origin HEAD:dev
          fi
